name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Vet, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Download modules
        run: go mod download

      - name: go vet
        run: CGO_ENABLED=0 go vet ./...

      - name: Run tests
        run: CGO_ENABLED=0 go test -v ./...

      - name: Build binary
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/sentinel
